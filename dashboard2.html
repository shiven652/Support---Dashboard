<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapture | Client Transition Portal</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        .portal{background:#f2f1ef;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
        .topbar{background:#111;padding:0 28px;height:60px;display:flex;align-items:center;}
        .topbar-logo{height:36px;width:auto;margin-right:20px;border-right:1px solid #333;padding-right:20px;display:flex;align-items:center;}
        .topbar-logo img{height:32px;width:auto;object-fit:contain;background:#fff;padding:3px 6px;border-radius:3px;}
        .topbar-brand{color:#fff;font-size:13px;font-weight:600;margin-right:20px;border-right:1px solid #333;padding-right:20px;}
        .topbar-sub{color:#777;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;}
        .main{padding:32px 28px 60px;max-width:1200px;margin:0 auto;}
        .page-header{margin-bottom:22px;border-bottom:1px solid #ccc;padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
        .page-title{font-size:26px;font-weight:300;color:#111;letter-spacing:-.5px;}
        .page-title em{color:#cc1f2d;font-style:normal;font-weight:500;}
        .recurrence{font-size:10px;letter-spacing:1.5px;color:#888;text-transform:uppercase;text-align:right;line-height:2;}
        .controls{display:flex;align-items:center;margin-bottom:20px;}
        .nav-btn{background:#fff;border:1px solid #ccc;padding:7px 14px;font-size:11px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
        .week-chip{background:#111;color:#fff;padding:7px 18px;font-size:11px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;}
        .days-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
        @media(max-width:768px){.days-grid{grid-template-columns:1fr;}}
        .day-card{background:#fff;border:1px solid #ddd;overflow:hidden;}
        .day-header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
        .slot-row{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid #f2f2f2;}
        .avail-btn{display:flex;align-items:center;border:1px solid #1e9e6e;background:#fff;cursor:pointer;border-radius:2px;}
        .avail-label{padding:6px 10px;font-size:10px;font-weight:600;color:#1e9e6e;text-transform:uppercase;}
        .avail-plus{padding:6px 9px;background:#1e9e6e;color:#fff;font-size:14px;}
        .booked-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#cc1f2d;color:#fff;text-transform:uppercase;}
        .cancel-btn{padding:6px 10px;font-size:10px;font-weight:600;background:#fff;color:#888;border:1px solid #ccc;cursor:pointer;text-transform:uppercase;}
        .past-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#999;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;}
        .modal-overlay.open{display:flex;}
        .modal{background:#fff;width:100%;max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);}
        .modal-header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;}
        .modal-body{padding:22px;}
        .field{margin-bottom:15px;}
        .field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;color:#888;margin-bottom:6px;}
        .field input{width:100%;border:1px solid #ddd;padding:9px 12px;font-size:13px;outline:none;}
        .field input:focus{border-color:#111;}
        .modal-footer{padding:0 22px 22px;display:flex;gap:10px;}
        .confirm-btn{flex:1;padding:12px;background:#111;color:#fff;border:none;font-size:12px;font-weight:600;text-transform:uppercase;cursor:pointer;}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;font-size:12px;z-index:200;opacity:0;transition:0.3s;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);border-left:3px solid #1e9e6e;}
        .toast.show{opacity:1;}
        .bookings-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid #ddd;}
        .bookings-table th{background:#111;color:#fff;padding:12px;text-align:left;text-transform:uppercase;font-size:10px;}
        .bookings-table td{padding:12px;border-bottom:1px solid #f2f2f2;}
        .bookings-table td a{color:#1e9e6e;text-decoration:none;font-weight:600;}
        .bookings-table td a:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="portal">
    <div class="topbar">
        <div class="topbar-logo">
            <img src="https://www.kapture.ai/wp-content/uploads/2023/10/Kapture-Logo.png" alt="Kapture Logo" class="logo-img">
            <span class="topbar-brand">Kapture CX</span>
        <span class="topbar-sub">Client Transition Portal</span>
    </div>
    <div class="main">
        <div class="page-header">
            <div class="page-title">Project <em>Handover</em> Schedule</div>
            <div class="recurrence"><strong>TUESDAYS &amp; THURSDAYS</strong><br>1:00 PM &ndash; 2:00 PM</div>
        </div>
        <div class="controls">
            <button class="nav-btn" onclick="shiftWeek(-1)">&#8592; Prev</button>
            <div class="week-chip" id="week-chip">WEEK OF LOADING...</div>
            <button class="nav-btn" onclick="shiftWeek(1)">Next &#8594;</button>
        </div>
        <div class="days-grid" id="days-grid"></div>
        <div style="font-size:13px;font-weight:600;margin-bottom:10px;text-transform:uppercase;color:#444;">Upcoming Booking Details</div>
        <div id="bookings-wrap"></div>
    </div>
</div>

<!-- Booking Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div style="font-size:15px;font-weight:500;">Book Handover Slot</div>
                <div id="modal-sub" style="font-size:10px;color:#aaa;text-transform:uppercase;"></div>
            </div>
            <button style="background:none;border:none;color:#fff;cursor:pointer;" onclick="closeModal()">&#10005;</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Name of Person <span style="color:#cc1f2d;">*</span></label><input type="text" id="f-name"></div>
            <div class="field"><label>Email Address <span style="color:#cc1f2d;">*</span></label><input type="email" id="f-email"></div>
            <div class="field"><label>Project Name</label><input type="text" id="f-project"></div>
            <div class="field"><label>Client Name</label><input type="text" id="f-client"></div>
            <div class="field"><label>Handover Checklist Link</label><input type="url" id="f-checklist" placeholder="https://docs.google.com/..."></div>
            <div class="field"><label>Remarks</label><input type="text" id="f-remarks" placeholder="Optional notes..."></div>
        </div>
        <div class="modal-footer">
            <button class="confirm-btn" onclick="confirmBooking()">Confirm Booking &#8594;</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznvWWOeQldh7T7tCdTZzz7PKfpfQhVsNoHurdNRl2raNwAT7H2BwUEefa9_DWwrdtU/exec";

const SLOTS = [{s:'1:00 PM', e:'1:30 PM'}, {s:'1:30 PM', e:'2:00 PM'}];
let weekOffset = 0, bookings = {}, pendingKey = null;

// ── Date helpers ──────────────────────────────────────────────────────────────
function midnight(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }

function isPastDate(d) { return midnight(d) < midnight(new Date()); }

/**
 * 2-working-day booking deadline:
 *   Tuesday  slot → must book by end of previous Thursday  (Tue − 5 days)
 *   Thursday slot → must book by end of previous Monday    (Thu − 3 days)
 */
function isBookingClosed(slotDate) {
    const today = midnight(new Date());
    const slot  = midnight(slotDate);
    const dow   = slot.getDay();
    let deadline;
    if (dow === 2) {
        deadline = new Date(slot); deadline.setDate(slot.getDate() - 5);
    } else if (dow === 4) {
        deadline = new Date(slot); deadline.setDate(slot.getDate() - 3);
    } else {
        return isPastDate(slotDate);
    }
    deadline.setHours(0,0,0,0);
    return today > deadline;
}

// ── Week helpers ──────────────────────────────────────────────────────────────
function getWeekDays(o) {
    const base = new Date(2026, 2, 17);
    const mon  = new Date(base);
    mon.setDate(base.getDate() - (base.getDay() - 1) + o * 7);
    const tue = new Date(mon); tue.setDate(mon.getDate() + 1);
    const thu = new Date(mon); thu.setDate(mon.getDate() + 3);
    return { tue, thu, mon };
}

function fmtDate(d) {
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}
function skey(dk, i) { return `w${weekOffset}_${dk}_${i}`; }

// ── Data fetch ────────────────────────────────────────────────────────────────
async function fetchLive() {
    try {
        const r = await fetch(`${SCRIPT_URL}?action=fetch&t=${Date.now()}`);
        const d = await r.json();
        if (d.success) { bookings = d.bookings; }
    } catch(e) { console.error(e); }
    render();
}

// ── Render calendar ───────────────────────────────────────────────────────────
function render() {
    const { tue, thu, mon } = getWeekDays(weekOffset);
    document.getElementById('week-chip').textContent =
        'WEEK OF ' + mon.toLocaleDateString('en-GB', { day:'numeric', month:'short' }).toUpperCase();
    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    [{ l:'Tuesday', d:tue, dk:'tue' }, { l:'Thursday', d:thu, dk:'thu' }].forEach(day => {
        const past   = isPastDate(day.d);
        const closed = !past && isBookingClosed(day.d);

        const deadlineLabel = (() => {
            if (past || !closed) return '';
            return day.d.getDay() === 2
                ? 'Booking closed \u2014 deadline was previous Thursday'
                : 'Booking closed \u2014 deadline was Monday';
        })();

        const slotsHtml = SLOTS.map((s, i) => {
            const k = skey(day.dk, i);
            const b = bookings[k];
            let actionHtml;

            if (past) {
                actionHtml = b
                    ? `<div class="booked-badge">Booked</div>`
                    : `<div class="past-badge">Past</div>`;
            } else if (closed) {
                actionHtml = b
                    ? `<div style="display:flex;gap:8px;">
                           <div class="booked-badge">Booked</div>
                           <button class="cancel-btn" onclick="handleCancel('${day.dk}',${i})">Cancel</button>
                       </div>`
                    : `<div class="past-badge" style="background:#e07b00;">Closed</div>`;
            } else if (b) {
                actionHtml = `<div style="display:flex;gap:8px;">
                    <div class="booked-badge">Booked</div>
                    <button class="cancel-btn" onclick="handleCancel('${day.dk}',${i})">Cancel</button>
                </div>`;
            } else {
                actionHtml = `<button class="avail-btn" onclick="openModal('${day.dk}',${i},'${day.l}')">
                    <span class="avail-label">Available</span><span class="avail-plus">+</span>
                </button>`;
            }

            return `<div class="slot-row">
                <div style="font-size:13px;">${s.s} &ndash; ${s.e}</div>
                ${actionHtml}
            </div>`;
        }).join('');

        const headerStyle = past ? 'background:#555;' : closed ? 'background:#333;' : '';
        const headerTag   = past  ? ' <span style="font-size:10px;color:#bbb;">(Past)</span>'
                          : closed ? ' <span style="font-size:10px;color:#f0a060;">&#9888; Closed</span>'
                          : '';
        const deadlineHtml = deadlineLabel
            ? `<div style="font-size:10px;color:#f0a060;padding:8px 20px;background:#1a1a1a;border-bottom:1px solid #333;">${deadlineLabel}</div>`
            : '';

        grid.innerHTML += `<div class="day-card">
            <div class="day-header" style="${headerStyle}">
                <div>${day.l}${headerTag}<br>
                <small style="color:#aaa;font-size:10px;">${fmtDate(day.d)}</small></div>
                <div>30 MIN</div>
            </div>
            ${deadlineHtml}
            <div>${slotsHtml}</div>
        </div>`;
    });
    renderTable();
}

// ── Render table ──────────────────────────────────────────────────────────────
function parseDateStr(str) {
    const months = { JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11 };
    const parts = String(str).trim().toUpperCase().split(' ');
    if (parts.length === 3) return new Date(parseInt(parts[2]), months[parts[1]] ?? 0, parseInt(parts[0]));
    return new Date(str);
}

function renderTable() {
    const wrap  = document.getElementById('bookings-wrap');
    const today = midnight(new Date());
    const upcoming = Object.values(bookings)
        .filter(b => parseDateStr(b.date) >= today)
        .sort((a, b) => parseDateStr(a.date) - parseDateStr(b.date));

    if (!upcoming.length) {
        wrap.innerHTML = '<div style="background:#fff;padding:20px;text-align:center;color:#aaa;">No upcoming bookings.</div>';
        return;
    }

    const fmtD = s => { try { return parseDateStr(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase(); } catch(e) { return s; } };

    wrap.innerHTML = `
        <table class="bookings-table">
            <thead><tr>
                <th>Booking Date</th><th>Slot</th><th>Client</th>
                <th>Project</th><th>Name</th><th>Checklist</th><th>Remarks</th>
            </tr></thead>
            <tbody>
                ${upcoming.map(b => `<tr>
                    <td>${fmtD(b.date)}</td>
                    <td>${b.time}</td>
                    <td>${b.client || '-'}</td>
                    <td>${b.project || '-'}</td>
                    <td>${b.name}</td>
                    <td>${b.checklist ? `<a href="${b.checklist}" target="_blank" rel="noopener">Click here</a>` : '-'}</td>
                    <td>${b.remarks || '-'}</td>
                </tr>`).join('')}
            </tbody>
        </table>`;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(dk, i, l) {
    pendingKey = { dk, i, l };
    document.getElementById('modal-sub').textContent = `${l} \u00b7 ${SLOTS[i].s}`;
    ['name','email','project','client','checklist','remarks'].forEach(id => {
        const el = document.getElementById('f-' + id);
        if (el) el.value = '';
    });
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

// ── Confirm booking ───────────────────────────────────────────────────────────
async function confirmBooking() {
    const data = {
        name:      document.getElementById('f-name').value.trim(),
        email:     document.getElementById('f-email').value.trim(),
        project:   document.getElementById('f-project').value.trim(),
        client:    document.getElementById('f-client').value.trim(),
        checklist: document.getElementById('f-checklist').value.trim(),
        remarks:   document.getElementById('f-remarks').value.trim()
    };
    if (!data.name || !data.email) return alert("Please fill in Name and Email.");

    const { tue, thu } = getWeekDays(weekOffset);
    const slotDate = pendingKey.dk === 'tue' ? tue : thu;

    if (isPastDate(slotDate)) return alert("This date has already passed and cannot be booked.");
    if (isBookingClosed(slotDate)) {
        const dow = slotDate.getDay();
        return alert(dow === 2
            ? "Booking for Tuesday is closed.\nDeadline: previous Thursday end of day."
            : "Booking for Thursday is closed.\nDeadline: Monday end of day.");
    }

    const payload = {
        action:   'book',
        slotKey:  skey(pendingKey.dk, pendingKey.i),
        day:      pendingKey.l,
        date:     fmtDate(slotDate),
        time:     `${SLOTS[pendingKey.i].s} - ${SLOTS[pendingKey.i].e}`,
        ...data
    };

    try {
        const res    = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.success) {
            bookings[payload.slotKey] = { ...payload, status:'booked' };
            closeModal(); render();
            showToast('Slot booked successfully!');
        } else {
            alert(result.error || 'Booking failed. Please try again.');
        }
    } catch(e) { alert('Network error. Please try again.'); }
}

// ── Cancel booking ────────────────────────────────────────────────────────────
async function handleCancel(dk, i) {
    const k = skey(dk, i);
    const { tue, thu } = getWeekDays(weekOffset);
    const slotDate = dk === 'tue' ? tue : thu;

    if (isPastDate(slotDate)) return alert("This date has already passed and cannot be cancelled.");
    if (!confirm("Cancel this booking?")) return;

    try {
        const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'cancel', slotKey:k }) });
        if ((await res.json()).success) { delete bookings[k]; render(); showToast('Booking cancelled.'); }
    } catch(e) { alert('Network error. Please try again.'); }
}

function shiftWeek(d) { weekOffset += d; render(); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

fetchLive();
</script>
</body>
</html>
