<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4ff;
      font-family: Arial, sans-serif;
    }
    .card {
      text-align: center;
      padding: 50px 60px;
      border: 4px solid #4a90e2;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
    }
    h1 {
      color: #4a90e2;
      font-size: 2em;
    }
    p {
      color: #555;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔄 Team Restructuring is Going On</h1>
    <p>🚀 We will come up with the final plan soon. Stay tuned! 📢</p>
  </div>
</body>
</html>
