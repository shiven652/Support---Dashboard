
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.portal{background:#f2f1ef;font-family:'Segoe UI',system-ui,sans-serif;}
.topbar{background:#111;padding:0 28px;height:50px;display:flex;align-items:center;}
.kp-badge{background:#cc1f2d;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 8px;margin-right:12px;}
.topbar-brand{color:#fff;font-size:13px;font-weight:600;margin-right:20px;border-right:1px solid #333;padding-right:20px;}
.topbar-sub{color:#777;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;}
.main{padding:32px 28px 60px;}
.page-header{margin-bottom:22px;border-bottom:1px solid #ccc;padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
.page-title{font-size:26px;font-weight:300;color:#111;letter-spacing:-.5px;}
.page-title em{color:#cc1f2d;font-style:normal;font-weight:500;}
.recurrence{font-size:10px;letter-spacing:1.5px;color:#888;text-transform:uppercase;text-align:right;line-height:2;}
.recurrence strong{color:#444;}
.controls{display:flex;align-items:center;margin-bottom:20px;}
.nav-btn{background:#fff;border:1px solid #ccc;padding:7px 14px;font-size:11px;letter-spacing:1px;cursor:pointer;color:#111;font-family:inherit;transition:all .15s;text-transform:uppercase;}
.nav-btn:hover{background:#111;color:#fff;border-color:#111;}
.week-chip{background:#111;color:#fff;padding:7px 18px;font-size:11px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;}
.legend{display:flex;gap:18px;margin-bottom:22px;font-size:11px;color:#777;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.dot-a{background:#1e9e6e;}.dot-b{background:#cc1f2d;}.dot-c{background:#888;}
.days-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
@media(max-width:540px){.days-grid{grid-template-columns:1fr;}}
.day-card{background:#fff;border:1px solid #ddd;overflow:hidden;}
.day-header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.day-name{font-size:20px;font-weight:300;}
.day-date{font-size:10px;letter-spacing:1.5px;color:#aaa;margin-top:3px;text-transform:uppercase;}
.dur-badge{background:#cc1f2d;color:#fff;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:4px 8px;text-transform:uppercase;}
.slot-row{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid #f2f2f2;gap:10px;}
.slot-row:last-child{border-bottom:none;}
.slot-row:hover{background:#fafafa;}
.slot-left{display:flex;align-items:center;flex:1;}
.s-dot{width:7px;height:7px;border-radius:50%;margin-right:10px;flex-shrink:0;}
.slot-time{font-size:13px;color:#111;}
.slot-sep{font-size:11px;color:#bbb;margin:0 5px;}
.slot-end{font-size:11px;color:#aaa;}
.dur-tag{margin-left:10px;font-size:10px;color:#aaa;letter-spacing:.5px;}
.avail-btn{display:flex;align-items:center;border:1px solid #1e9e6e;background:#fff;cursor:pointer;font-family:inherit;overflow:hidden;}
.avail-label{padding:6px 10px;font-size:10px;font-weight:600;letter-spacing:1.2px;color:#1e9e6e;text-transform:uppercase;}
.avail-plus{padding:6px 9px;background:#1e9e6e;color:#fff;font-size:14px;line-height:1;border-left:1px solid #1e9e6e;transition:background .15s;}
.avail-btn:hover .avail-plus{background:#0e7a52;}
.slot-actions{display:flex;align-items:center;gap:8px;}
.booked-badge{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1.2px;background:#cc1f2d;color:#fff;text-transform:uppercase;}
.cancel-btn{padding:6px 10px;font-size:10px;font-weight:600;letter-spacing:1px;background:#fff;color:#888;border:1px solid #ccc;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .15s;}
.cancel-btn:hover{background:#fff0f0;color:#cc1f2d;border-color:#cc1f2d;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;width:100%;max-width:420px;overflow:hidden;}
.modal-header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;}
.modal-title{font-size:15px;font-weight:500;}
.modal-sub{font-size:10px;color:#aaa;letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
.modal-close{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;line-height:1;padding:2px 4px;}
.modal-close:hover{color:#fff;}
.modal-body{padding:22px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:6px;}
.field input{width:100%;border:1px solid #ddd;padding:9px 12px;font-size:13px;font-family:inherit;color:#111;outline:none;transition:border .15s;}
.field input:focus{border-color:#111;}
.field input.err{border-color:#cc1f2d;}
.err-msg{font-size:11px;color:#cc1f2d;margin-top:4px;display:none;}
.err-msg.show{display:block;}
.modal-footer{padding:0 22px 22px;display:flex;gap:10px;}
.confirm-btn{flex:1;padding:10px;background:#111;color:#fff;border:none;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
.confirm-btn:hover:not(:disabled){background:#333;}
.confirm-btn:disabled{background:#888;cursor:not-allowed;}
.cancel-modal-btn{padding:10px 16px;background:#fff;color:#888;border:1px solid #ddd;font-size:12px;cursor:pointer;font-family:inherit;}
.cancel-modal-btn:hover{background:#f7f7f7;}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
.spinner.show{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;font-size:12px;font-weight:500;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;border-left:3px solid #1e9e6e;background:#fff;color:#111;box-shadow:0 2px 12px rgba(0,0,0,.12);max-width:300px;}
.toast.error{border-left-color:#cc1f2d;}
.toast.show{opacity:1;transform:translateY(0);}
.section-title{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#444;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #ddd;}
.no-bookings{font-size:13px;color:#aaa;padding:20px 0;text-align:center;}
.bookings-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #ddd;font-size:12px;}
.bookings-table th{background:#111;color:#fff;padding:10px 14px;text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;}
.bookings-table td{padding:10px 14px;border-bottom:1px solid #f2f2f2;color:#333;vertical-align:middle;}
.bookings-table tr:last-child td{border-bottom:none;}
.bookings-table tr:hover td{background:#fafafa;}
.status-booked{display:inline-block;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:#fff0f0;color:#cc1f2d;border:1px solid #f5b3b3;}
.status-cancelled{display:inline-block;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:#f5f5f5;color:#999;border:1px solid #ddd;}
</style>

<div class="portal">
  <div class="topbar">
    <span class="kp-badge">KP</span>
    <span class="topbar-brand">Kapture CX</span>
    <span class="topbar-sub">Client Transition Portal</span>
  </div>
  <div class="main">
    <div class="page-header">
      <div class="page-title">Project <em>Handover</em> Schedule</div>
      <div class="recurrence"><strong>TUESDAYS</strong> · 30 MIN &nbsp;|&nbsp; <strong>THURSDAYS</strong> · 30 MIN<br>12:30 PM – 4:00 PM</div>
    </div>
    <div class="controls">
      <button class="nav-btn" onclick="shiftWeek(-1)">← Prev</button>
      <div class="week-chip" id="week-chip">WEEK OF 17 MAR</div>
      <button class="nav-btn" onclick="shiftWeek(1)">Next →</button>
    </div>
    <div class="legend">
      <span><span class="dot dot-a"></span>Available</span>
      <span><span class="dot dot-b"></span>Booked</span>
    </div>
    <div class="days-grid" id="days-grid"></div>
    <div class="section-title">Booking Details</div>
    <div id="bookings-wrap"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Book a Slot</div>
        <div class="modal-sub" id="modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Name of Person</label><input type="text" id="f-name" placeholder="e.g. Rahul Sharma"><div class="err-msg" id="e-name">Please enter a name</div></div>
      <div class="field"><label>Email Address</label><input type="email" id="f-email" placeholder="e.g. rahul@company.com"><div class="err-msg" id="e-email">Please enter a valid email</div></div>
      <div class="field"><label>Project Name</label><input type="text" id="f-project" placeholder="e.g. CRM Migration"><div class="err-msg" id="e-project">Please enter a project name</div></div>
      <div class="field"><label>Client Name</label><input type="text" id="f-client" placeholder="e.g. Acme Corp"><div class="err-msg" id="e-client">Please enter a client name</div></div>
    </div>
    <div class="modal-footer">
      <button class="cancel-modal-btn" onclick="closeModal()">Cancel</button>
      <button class="confirm-btn" id="confirm-btn" onclick="confirmBooking()">
        <span id="btn-text">Confirm Booking →</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_EMAIL='shivendra.singh@kapturecrm.com';
const SLOTS=[
  {start:'1:00 PM',end:'1:30 PM'},
  {start:'1:30 PM',end:'2:00 PM'}
];
let weekOffset=0,bookings={},pendingKey=null;

function getWeekDays(o){
  const base=new Date(2026,2,17),dow=base.getDay();
  const mon=new Date(base);mon.setDate(base.getDate()-(dow===0?6:dow-1)+o*7);
  const tue=new Date(mon);tue.setDate(mon.getDate()+1);
  const thu=new Date(mon);thu.setDate(mon.getDate()+3);
  return{tue,thu,mon};
}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();}
function fmtChip(d){return'WEEK OF '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase();}
function skey(dk,i){return`w${weekOffset}_${dk}_${i}`;}

function showToast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(isErr?' error':'');
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),4000);
}

function buildSlotHTML(dk,i,dayLabel){
  const k=skey(dk,i);const b=bookings[k];
  const state=b?b.status:'available';
  const dotColor=state==='booked'?'#cc1f2d':'#1e9e6e';
  let actionHtml='';
  if(state==='available'){
    actionHtml=`<button class="avail-btn" onclick="openModal('${dk}',${i},'${dayLabel}')"><span class="avail-label">Available</span><span class="avail-plus">+</span></button>`;
  } else {
    actionHtml=`<div class="slot-actions"><div class="booked-badge">Slot Booked</div><button class="cancel-btn" onclick="cancelSlot('${dk}',${i},'${dayLabel}')">Cancel</button></div>`;
  }
  return`<div class="slot-row" id="sr-${k}">
    <div class="slot-left"><span class="s-dot" style="background:${dotColor}"></span><span class="slot-time">${SLOTS[i].start}</span><span class="slot-sep">–</span><span class="slot-end">${SLOTS[i].end}</span><span class="dur-tag">30 MIN</span></div>
    ${actionHtml}
  </div>`;
}

function refreshRow(dk,i,dayLabel){
  const k=skey(dk,i);
  const old=document.getElementById(`sr-${k}`);
  if(!old)return;
  old.outerHTML=buildSlotHTML(dk,i,dayLabel);
}

function renderDays(){
  const{tue,thu,mon}=getWeekDays(weekOffset);
  document.getElementById('week-chip').textContent=fmtChip(mon);
  const grid=document.getElementById('days-grid');grid.innerHTML='';
  [{label:'Tuesday',date:tue,dk:'tue'},{label:'Thursday',date:thu,dk:'thu'}].forEach(({label,date,dk})=>{
    const html=SLOTS.map((_,i)=>buildSlotHTML(dk,i,label)).join('');
    const card=document.createElement('div');card.className='day-card';
    card.innerHTML=`<div class="day-header"><div><div class="day-name">${label}</div><div class="day-date">${fmtDate(date)}</div></div><div class="dur-badge">30 Min</div></div><div>${html}</div>`;
    grid.appendChild(card);
  });
}

function openModal(dk,i,dayLabel){
  pendingKey={dk,i,dayLabel};
  document.getElementById('modal-sub').textContent=`${dayLabel} · ${SLOTS[i].start} – ${SLOTS[i].end}`;
  ['name','email','project','client'].forEach(f=>{
    document.getElementById('f-'+f).value='';
    document.getElementById('f-'+f).classList.remove('err');
    document.getElementById('e-'+f).classList.remove('show');
  });
  setLoading(false);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),100);
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');pendingKey=null;}
function setLoading(v){
  document.getElementById('confirm-btn').disabled=v;
  document.getElementById('btn-text').style.display=v?'none':'';
  document.getElementById('btn-spinner').className='spinner'+(v?' show':'');
}

async function confirmBooking(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const project=document.getElementById('f-project').value.trim();
  const client=document.getElementById('f-client').value.trim();
  let ok=true;
  [{v:name,id:'name'},{v:project,id:'project'},{v:client,id:'client'}].forEach(({v,id})=>{
    const valid=v.length>0;
    document.getElementById('f-'+id).classList.toggle('err',!valid);
    document.getElementById('e-'+id).classList.toggle('show',!valid);
    if(!valid)ok=false;
  });
  const emailValid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  document.getElementById('f-email').classList.toggle('err',!emailValid);
  document.getElementById('e-email').classList.toggle('show',!emailValid);
  if(!emailValid)ok=false;
  if(!ok)return;

  const{dk,i,dayLabel}=pendingKey;
  const k=skey(dk,i);
  const{tue,thu}=getWeekDays(weekOffset);
  const dateStr=fmtDate(dk==='tue'?tue:thu);
  const timeStr=`${SLOTS[i].start} – ${SLOTS[i].end}`;

  bookings[k]={name,email,project,client,day:dayLabel,date:dateStr,time:timeStr,dk,i,dayLabel,status:'booked'};
  closeModal();
  refreshRow(dk,i,dayLabel);
  renderBookingsTable();
  setLoading(true);
  await sendEmails('booking',{name,email,project,client,day:dayLabel,date:dateStr,time:timeStr});
  setLoading(false);
}

async function cancelSlot(dk,i,dayLabel){
  const k=skey(dk,i);const b=bookings[k];if(!b)return;
  if(!confirm(`Cancel ${b.name}'s slot on ${b.day} ${b.time}?`))return;
  const snapshot={...b};
  delete bookings[k];
  refreshRow(dk,i,dayLabel);
  renderBookingsTable();
  await sendEmails('cancellation',snapshot);
}

async function sendEmails(type,d){

const url="https://script.google.com/macros/s/AKfycbzQVRRjDkDKGeEYqA_19cyiZO4RIxrayvTGPj9b92CGqwOpg7wxWzEqK3wFi13VNH-G/exec";

const params = new URLSearchParams({
name:d.name,
email:d.email,
project:d.project,
client:d.client,
day:d.day,
date:d.date,
time:d.time
});

const img = new Image();
img.src = url + "?" + params.toString();

if(type==="booking"){
showToast("✅ Slot booked! Email & calendar invite sent.");
}else{
showToast("⚠ Slot cancelled. Notification email sent.");
}
}catch(e){

showToast("❌ Slot updated but email notification failed.",true);

}
}
function renderBookingsTable(){
  const wrap=document.getElementById('bookings-wrap');
  const all=Object.values(bookings);
  if(!all.length){wrap.innerHTML='<div class="no-bookings">No bookings yet. Click Available + to book a slot.</div>';return;}
  wrap.innerHTML=`<table class="bookings-table">
    <thead><tr><th>#</th><th>Day & Date</th><th>Time Slot</th><th>Name</th><th>Email</th><th>Project</th><th>Client</th><th>Status</th></tr></thead>
    <tbody>${all.map((b,idx)=>`<tr>
      <td style="color:#aaa">${idx+1}</td>
      <td><strong>${b.day}</strong><br><span style="color:#aaa;font-size:11px">${b.date}</span></td>
      <td>${b.time}</td><td>${b.name}</td>
      <td style="color:#555">${b.email}</td>
      <td>${b.project}</td><td>${b.client}</td>
      <td><span class="status-booked">Booked</span></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function shiftWeek(d){weekOffset+=d;renderDays();}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modal-overlay').classList.contains('open'))confirmBooking();
});
renderDays();renderBookingsTable();
</script>
