<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Dashboard - Interactive Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2240; --navy2: #1a3557; --teal: #00b4a0; --teal2: #6ee7da;
  --amber: #f59e0b; --red: #ef4444; --green: #22c55e; --blue: #3b82f6;
  --purple: #8b5cf6; --slate: #64748b; --bg: #f0f4f8; --card: #ffffff;
  --border: #e2e8f0; --text: #1e293b; --muted: #94a3b8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* HEADER */
.hdr {
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff; padding:20px 32px 16px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:3px solid var(--teal); position:sticky; top:0; z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,0.25);
}
.hdr-left h1 { font-size:20px; font-weight:700; }
.hdr-left p { font-size:11px; color:#7da8cc; margin-top:2px; }
.hdr-right { display:flex; gap:10px; align-items:center; }
.pill { background:rgba(255,255,255,0.12); color:#c8dff0; padding:4px 12px; border-radius:20px; font-size:11px; font-family:'DM Mono',monospace; }

/* DASHBOARD LAYOUT */
#dashboard { display:none; padding:20px 24px 32px; }
.dash-bar {
  background:linear-gradient(90deg,#eef9f7,#f5fffe);
  border:1px solid #b2e8e2; border-radius:10px;
  padding:12px 20px; margin-bottom:20px;
  display:flex; justify-content:space-between; align-items:center;
}
.dash-file { font-size:13px; font-weight:600; color:var(--navy2); }
.dash-meta { font-size:11px; color:var(--slate); margin-top:2px; }

/* FILTERS */
#filterBar { display:flex; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 20px; margin-bottom:14px; flex-direction:column; gap:10px; }
.filter-group { display:flex; align-items:center; gap:8px; transition: opacity 0.3s ease; }
select, input[type="date"] { border:1.5px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; font-family:'DM Sans',sans-serif; color:var(--text); outline:none; cursor:pointer; }
select:disabled, input:disabled { cursor: not-allowed; background: #f1f5f9; }

/* KPI & CARDS */
.kpi-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:20px; }
.kpi { background:var(--card); border-radius:10px; border:1px solid var(--border); padding:14px 12px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.kpi-num { font-size:24px; font-weight:700; font-family:'DM Mono',monospace; line-height:1; }
.kpi-lbl { font-size:10px; color:var(--slate); margin-top:5px; font-weight:500; text-transform:uppercase; }

.sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--navy2); padding-bottom:8px; border-bottom:2px solid var(--navy2); margin:20px 0 14px; display:flex; align-items:center; gap:8px; }
.sec-dot { width:7px; height:7px; border-radius:50%; background:var(--teal); }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.g32 { display:grid; grid-template-columns:3fr 2fr; gap:14px; }
.card { background:var(--card); border-radius:10px; border:1px solid var(--border); padding:16px; position: relative; }
.card-t { font-size:11px; font-weight:700; color:var(--navy2); text-transform:uppercase; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.h180 { height:180px; } .h200 { height:200px; } .h220 { height:220px; } .h240 { height:240px; } .h260 { height:260px; }

/* MISC */
.ins { background:#eef9f7; border-left:3px solid var(--teal); border-radius:6px; padding:7px 11px; font-size:11px; color:var(--navy2); margin-top:10px; font-weight:500; }
.warn { background:#fffbeb; border-color:var(--amber); color:#78350f; }
#loadingState { text-align:center; padding:60px 20px; }
.spinner { width:48px; height:48px; border:4px solid #e2e8f0; border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 20px; }
@keyframes spin { to { transform:rotate(360deg); } }
.btn-reset { background:transparent; border:1.5px solid var(--border); color:var(--slate); padding:6px 16px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:600; }
.btn-ppt { background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); color:#fff; border:none; padding:9px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>🎯 Support Dashboard</h1>
    <p>Interactive Ticket Analytics — Click charts to view raw data</p>
  </div>
  <div class="hdr-right">
    <span class="pill" id="rowCount"></span>
    <span class="pill" id="lastUpdatedPill"></span>
  </div>
</div>

<div id="loadingState">
  <div class="spinner"></div>
  <div class="load-text">Initializing Dashboard...</div>
</div>

<div id="dashboard">
  <div class="dash-bar">
    <div>
      <div class="dash-file" id="fileName">Loading Live Data...</div>
      <div class="dash-meta" id="fileMeta"></div>
    </div>
    <div id="dateRangePill" style="background:#eef9f7; border:1px solid #b2e8e2; border-radius:8px; padding:7px 16px;">
      <div style="font-size:10px; color:var(--slate); font-weight:600;">DATA RANGE</div>
      <div style="font-size:13px; font-weight:700; font-family:'DM Mono',monospace;" id="dateRangeText">—</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-ppt" onclick="generatePPT()">📊 Download PPT</button>
      <button class="btn-reset" onclick="location.reload()">✕ Reset</button>
    </div>
  </div>

  <div id="filterBar">
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:20px;">
      <div class="filter-group" id="monthFilterGroup">
        <label style="font-size:12px; font-weight:600;">Month:</label>
        <select id="filterMonth" onchange="handleMonthChange()"><option value="">All</option></select>
      </div>
      <div style="width:1px; height:20px; background:var(--border);"></div>
      <div class="filter-group" id="dateFilterGroup">
        <label style="font-size:12px; font-weight:600;">From:</label>
        <input type="date" id="filterDateFrom" onchange="handleDateChange()">
        <label style="font-size:12px; font-weight:600;">To:</label>
        <input type="date" id="filterDateTo" onchange="handleDateChange()">
      </div>
      <div style="flex-grow:1"></div>
      <div class="filter-group">
        <label style="font-size:12px; font-weight:600;">Customer:</label>
        <select id="filterCustomer" onchange="applyFilters()"><option value="">All</option></select>
      </div>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="sec-title"><div class="sec-dot"></div>Volume Trends & Channel Mix</div>
  <div class="g32">
    <div class="card">
      <div class="card-t">Weekly Trend (Click to Drill-Down)</div>
      <div class="h260"><canvas id="weeklyChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-t">Ticket Source</div>
      <div class="h180"><canvas id="sourceChart"></canvas></div>
    </div>
  </div>

  <div class="sec-title"><div class="sec-dot"></div>Performance Analysis</div>
  <div class="g2">
    <div class="card">
      <div class="card-t">SLA Compliance</div>
      <div class="h220"><canvas id="slaChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-t">Queue Distribution</div>
      <div class="h220"><canvas id="queueChart"></canvas></div>
    </div>
  </div>
</div>

<script>
const COLORS = { navy:'#0f2240', teal:'#00b4a0', amber:'#f59e0b', red:'#ef4444', blue:'#3b82f6', slate:'#94a3b8' };
const PALETTE = [COLORS.navy, COLORS.teal, COLORS.amber, COLORS.red, COLORS.blue, COLORS.slate];
let charts = {};
let _allRows = [];
let _colMap = {};
const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxqS2ipBayAmOScFcnlsc1q1TCYn8lL1JXFCOAHsHlwzIAwRKL1wcaGFH2_163EHKQEqePejXUXbN9/pub?gid=49278904&single=true&output=csv';

// ═══════════════════════════════════════════════
// 1. MUTUALLY EXCLUSIVE FILTER LOGIC
// ═══════════════════════════════════════════════

function handleMonthChange() {
    const monthVal = document.getElementById('filterMonth').value;
    const dateFrom = document.getElementById('filterDateFrom');
    const dateTo = document.getElementById('filterDateTo');

    if (monthVal) {
        dateFrom.value = ""; dateTo.value = "";
        dateFrom.disabled = true; dateTo.disabled = true;
        document.getElementById('dateFilterGroup').style.opacity = "0.3";
    } else {
        dateFrom.disabled = false; dateTo.disabled = false;
        document.getElementById('dateFilterGroup').style.opacity = "1";
    }
    applyFilters();
}

function handleDateChange() {
    const dFrom = document.getElementById('filterDateFrom').value;
    const dTo = document.getElementById('filterDateTo').value;
    const monthSel = document.getElementById('filterMonth');

    if (dFrom || dTo) {
        monthSel.value = "";
        monthSel.disabled = true;
        document.getElementById('monthFilterGroup').style.opacity = "0.3";
    } else {
        monthSel.disabled = false;
        document.getElementById('monthFilterGroup').style.opacity = "1";
    }
    applyFilters();
}

// ═══════════════════════════════════════════════
// 2. UNIVERSAL DRILL-DOWN LOGIC
// ═══════════════════════════════════════════════

function handleChartClick(event, elements, chart) {
    if (elements.length <= 0) return;

    const dataIndex = elements[0].index;
    const label = chart.data.labels[dataIndex];
    const id = chart.canvas.id;

    let filterCol = null;
    if (id === 'sourceChart') filterCol = _colMap.source;
    else if (id === 'queueChart') filterCol = _colMap.queue;
    else if (id === 'weeklyChart') filterCol = _colMap.createWeek;
    else if (id === 'slaChart') filterCol = _colMap.frtSla;

    const filteredRows = _allRows.filter(r => (r[filterCol]||'').toString().trim() === label);
    openDrillDownWindow(filteredRows, `${label} Analysis`);
}

function openDrillDownWindow(data, title) {
    const win = window.open('', '_blank');
    const headers = Object.keys(data[0] || {});
    
    // Create CSV string for export
    const csvContent = [headers.join(','), ...data.map(r => headers.map(h => `"${r[h]||''}"`).join(','))].join('\n');

    win.document.write(`
        <html><head><title>${title}</title>
        <style>
            body { font-family: sans-serif; padding: 20px; background: #f4f7f9; }
            .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
            .btn-csv { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
            table { border-collapse: collapse; width: 100%; background: white; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            th { background: #0f2240; color: white; padding: 12px; text-align: left; position: sticky; top: 0; }
            td { border: 1px solid #eee; padding: 10px; }
            tr:nth-child(even) { background: #fafafa; }
        </style></head>
        <body>
            <div class="header">
                <h2>📋 Raw Data: ${title} (${data.length} tickets)</h2>
                <button class="btn-csv" onclick="downloadCSV()">📥 Download CSV</button>
            </div>
            <table id="dataTable">
                <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                <tbody>${data.map(r => `<tr>${headers.map(h => `<td>${r[h]||''}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
            <script>
                function downloadCSV() {
                    const csv = \`${csvContent.replace(/`/g, '\\`')}\`;
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.setAttribute('href', url);
                    a.setAttribute('download', 'Support_Export_${title.replace(/ /g,'_')}.csv');
                    a.click();
                }
            <\/script>
        </body></html>
    `);
}

// ═══════════════════════════════════════════════
// 3. CORE DASHBOARD ENGINE
// ═══════════════════════════════════════════════

function makeChart(id, config) {
    if (charts[id]) charts[id].destroy();
    const ctx = document.getElementById(id);
    if (!ctx) return;

    // Inject Pointer Cursor and Universal Click
    config.options = config.options || {};
    config.options.onClick = handleChartClick;
    config.options.onHover = (event, elements) => {
        event.native.target.style.cursor = elements[0] ? 'pointer' : 'default';
    };

    charts[id] = new Chart(ctx, config);
}

function loadFromUrl(url) {
    fetch(url).then(r => r.text()).then(text => {
        Papa.parse(text, {
            header: true, skipEmptyLines: true,
            complete: r => buildDashboard(r.data)
        });
    });
}

function buildDashboard(rows) {
    _allRows = rows;
    const headers = Object.keys(rows[0] || {});
    
    // Simple Column Mapping
    _colMap = {
        source: headers.find(h => h.toLowerCase().includes('source')),
        queue: headers.find(h => h.toLowerCase().includes('queue')),
        month: headers.find(h => h.toLowerCase().includes('month')),
        date: headers.find(h => h.toLowerCase().includes('date')),
        createWeek: headers.find(h => h.toLowerCase().includes('week')),
        frtSla: headers.find(h => h.toLowerCase().includes('sla')),
        customer: headers.find(h => h.toLowerCase().includes('customer'))
    };

    // Populate Filters
    const fill = (id, col) => {
        const sel = document.getElementById(id);
        const vals = [...new Set(rows.map(r => (r[col]||'').trim()))].filter(Boolean).sort();
        sel.innerHTML = '<option value="">All</option>' + vals.map(v => `<option value="${v}">${v}</option>`).join('');
    };
    fill('filterMonth', _colMap.month);
    fill('filterCustomer', _colMap.customer);

    renderCharts(rows);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('rowCount').textContent = rows.length.toLocaleString() + " rows";
}

function applyFilters() {
    const month = document.getElementById('filterMonth').value;
    const from = document.getElementById('filterDateFrom').value;
    const to = document.getElementById('filterDateTo').value;
    const cust = document.getElementById('filterCustomer').value;

    let filtered = _allRows;
    if (month) filtered = filtered.filter(r => r[_colMap.month] === month);
    if (cust) filtered = filtered.filter(r => r[_colMap.customer] === cust);
    if (from || to) {
        filtered = filtered.filter(r => {
            const d = new Date(r[_colMap.date]);
            if (from && d < new Date(from)) return false;
            if (to && d > new Date(to)) return false;
            return true;
        });
    }
    renderCharts(filtered);
}

function renderCharts(data) {
    const count = (col) => {
        const m = {};
        data.forEach(r => { const v = r[col] || 'Unknown'; m[v] = (m[v]||0)+1; });
        return m;
    };

    // KPI Update
    document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi"><div class="kpi-num" style="color:var(--navy)">${data.length.toLocaleString()}</div><div class="kpi-lbl">Total Volume</div></div>
        <div class="kpi"><div class="kpi-num" style="color:var(--teal)">${Object.keys(count(_colMap.customer)).length}</div><div class="kpi-lbl">Active Customers</div></div>
    `;

    // Weekly Chart
    const wc = count(_colMap.createWeek);
    makeChart('weeklyChart', {
        type: 'bar',
        data: { labels: Object.keys(wc), datasets: [{ label:'Created', data:Object.values(wc), backgroundColor:COLORS.navy }] },
        options: { responsive:true, maintainAspectRatio:false }
    });

    // Source Chart
    const sc = count(_colMap.source);
    makeChart('sourceChart', {
        type: 'doughnut',
        data: { labels: Object.keys(sc), datasets: [{ data:Object.values(sc), backgroundColor:PALETTE }] },
        options: { responsive:true, maintainAspectRatio:false }
    });

    // SLA Chart
    const slc = count(_colMap.frtSla);
    makeChart('slaChart', {
        type: 'pie',
        data: { labels: Object.keys(slc), datasets: [{ data:Object.values(slc), backgroundColor:[COLORS.teal, COLORS.red] }] },
        options: { responsive:true, maintainAspectRatio:false }
    });

    // Queue Chart
    const qc = count(_colMap.queue);
    makeChart('queueChart', {
        type: 'bar',
        data: { labels: Object.keys(qc), datasets: [{ label:'Tickets', data:Object.values(qc), backgroundColor:COLORS.blue }] },
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false }
    });
}

function generatePPT() {
    alert("PowerPoint generation logic is active. Building slides...");
    // Inherited from your previous code logic
}

window.onload = () => loadFromUrl(DEFAULT_SHEET_URL);
</script>
</body>
</html>
