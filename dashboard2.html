<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapture | Client Transition Portal</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* CSS styles remain the same as your original provided code */
        *{box-sizing:border-box;margin:0;padding:0;}
        #login-screen { display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #111; flex-direction: column; gap: 28px; }
        .login-box { background: #fff; padding: 44px 40px 36px; width: 100%; max-width: 380px; text-align: center; }
        .login-logo { height: 28px; margin-bottom: 20px; }
        .login-title { font-size: 18px; font-weight: 300; color: #111; margin-bottom: 4px; }
        .login-title em { color: #cc1f2d; font-style: normal; font-weight: 600; }
        .login-sub { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 28px; }
        .login-divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        .login-note { font-size: 10px; color: #bbb; margin-top: 14px; }
        #g_id_signin { display: flex; justify-content: center; }
        #portal-screen { display: none; }
        .portal{background:#f2f1ef;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
        .topbar{background:#111;padding:0 28px;height:60px;display:flex;align-items:center;gap:0;}
        .logo-img {height: 25px; width: auto; margin-right: 20px;}
        .topbar-brand{color:#fff;font-size:13px;font-weight:600;margin-right:20px;border-right:1px solid #333;padding-right:20px;}
        .topbar-sub{color:#777;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;}
        .topbar-user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #333; object-fit: cover; }
        .user-avatar-placeholder { width: 30px; height: 30px; border-radius: 50%; background: #cc1f2d; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .user-name { color: #ccc; font-size: 11px; }
        .signout-btn { background: none; border: 1px solid #444; color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; padding: 5px 10px; cursor: pointer; }
        .signout-btn:hover { border-color: #cc1f2d; color: #cc1f2d; }
        .main{padding:32px 28px 60px; max-width: 1200px; margin: 0 auto;}
        .page-header{margin-bottom:22px;border-bottom:1px solid #ccc;padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
        .page-title{font-size:26px;font-weight:300;color:#111;letter-spacing:-.5px;}
        .page-title em{color:#cc1f2d;font-style:normal;font-weight:500;}
        .recurrence{font-size:10px;letter-spacing:1.5px;color:#888;text-transform:uppercase;text-align:right;line-height:2;}
        .controls{display:flex;align-items:center;margin-bottom:20px;}
        .nav-btn{background:#fff;border:1px solid #ccc;padding:7px 14px;font-size:11px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
        .week-chip{background:#111;color:#fff;padding:7px 18px;font-size:11px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;}
        .days-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
        @media(max-width:768px){.days-grid{grid-template-columns:1fr;}}
        .day-card{background:#fff;border:1px solid #ddd;overflow:hidden;}
        .day-header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
        .slot-row{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid #f2f2f2;}
        .avail-btn{display:flex;align-items:center;border:1px solid #1e9e6e;background:#fff;cursor:pointer;border-radius:2px;}
        .avail-label{padding:6px 10px;font-size:10px;font-weight:600;color:#1e9e6e;text-transform:uppercase;}
        .avail-plus{padding:6px 9px;background:#1e9e6e;color:#fff;font-size:14px;}
        .booked-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#cc1f2d;color:#fff;text-transform:uppercase;}
        .closed-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#eee;color:#999;text-transform:uppercase;}
        .cancel-btn{padding:6px 10px;font-size:10px;font-weight:600;background:#fff;color:#888;border:1px solid #ccc;cursor:pointer;text-transform:uppercase;}
        .locked-badge{padding:5px 8px;font-size:13px;color:#ccc;cursor:default;border:1px solid #eee;background:#fafafa;border-radius:2px;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;}
        .modal-overlay.open{display:flex;}
        .modal{background:#fff;width:100%;max-width:420px;box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);}
        .modal-header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;}
        .modal-body{padding:22px;}
        .field{margin-bottom:15px;}
        .field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;color:#888;margin-bottom:4px;}
        .field input{width:100%;border:1px solid #ddd;padding:9px 12px;font-size:13px;outline:none;}
        .field input[readonly]{background:#f7f7f7;color:#666;cursor:default;}
        .modal-footer{padding:0 22px 22px;display:flex;gap:10px;}
        .confirm-btn{flex:1;padding:12px;background:#111;color:#fff;border:none;font-size:12px;font-weight:600;text-transform:uppercase;cursor:pointer;}
        .booked-by { font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .bookings-table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border:1px solid #ddd;}
        .bookings-table th{background:#111;color:#fff;padding:12px;text-align:left;text-transform:uppercase;font-size:9px;}
        .bookings-table td{padding:10px 12px;border-bottom:1px solid #f2f2f2;}
        .link-btn {color: #cc1f2d; text-decoration: none; font-weight: bold;}
        .audit-pill { display: inline-block; background: #f0f0f0; color: #666; font-size: 9px; padding: 2px 7px; border-radius: 20px; letter-spacing: .3px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <img src="https://testrigor.com/wp-content/uploads/2023/12/kapture-cx.svg" alt="Kapture" class="login-logo">
        <div class="login-title">Client <em>Transition</em> Portal</div>
        <div class="login-sub">Handover Scheduling System</div>
        <hr class="login-divider">
        <div id="g_id_onload" data-client_id="354238215970-vj0hflaubcofhm79qej4lee4c11n57fu.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
        <div id="g_id_signin" class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        <p class="login-note">Sign in with your Google account to access the portal.</p>
    </div>
</div>

<div id="portal-screen">
    <div class="portal">
        <div class="topbar">
            <img src="https://testrigor.com/wp-content/uploads/2023/12/kapture-cx.svg" alt="Logo" class="logo-img">
            <span class="topbar-brand">Kapture CX</span>
            <span class="topbar-sub">Client Transition Portal</span>
            <div class="topbar-user">
                <div class="user-avatar-placeholder" id="user-initials">?</div>
                <span class="user-name" id="user-display-name">—</span>
                <button class="signout-btn" onclick="signOut()">Sign Out</button>
            </div>
        </div>
        <div class="main">
            <div class="page-header">
                <div class="page-title">Project <em>Handover</em> Schedule</div>
                <div class="recurrence"><strong>TUESDAYS & THURSDAYS</strong><br>1:00 PM – 2:00 PM</div>
            </div>
            <div class="controls">
                <button class="nav-btn" onclick="shiftWeek(-1)">← Prev</button>
                <div class="week-chip" id="week-chip">LOADING...</div>
                <button class="nav-btn" onclick="shiftWeek(1)">Next →</button>
            </div>
            <div class="days-grid" id="days-grid"></div>
            <div style="font-size:13px;font-weight:600;margin-bottom:10px;text-transform:uppercase;color:#444;">Upcoming Booking Details</div>
            <div id="bookings-wrap"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div style="font-size:15px;font-weight:500;">Book Handover Slot</div>
                <div id="modal-sub" style="font-size:10px;color:#aaa;text-transform:uppercase;"></div>
            </div>
            <button style="background:none;border:none;color:#fff;cursor:pointer;" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Name</label><input type="text" id="f-name" readonly></div>
            <div class="field"><label>Email</label><input type="email" id="f-email" readonly></div>
            <div class="field"><label>Project Name</label><input type="text" id="f-project"></div>
            <div class="field"><label>Client Name</label><input type="text" id="f-client"></div>
            <div class="field"><label>Handover Checklist (Link)</label><input type="text" id="f-checklist"></div>
            <div class="field"><label>Remarks</label><input type="text" id="f-remarks"></div>
        </div>
        <div class="modal-footer"><button class="confirm-btn" onclick="confirmBooking()">Confirm Booking →</button></div>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcM8VXSILNLlMm-uPkhMZ2GwpBf2CopLFdfjR-5eMcnITdXCId1maWJdV1rPgF9Goc/exec";
let currentUser = null, weekOffset = 0, bookings = {}, allRows = [], pendingKey = null;

const SLOTS = [{s:'1:00 PM', e:'1:30 PM'}, {s:'1:30 PM', e:'2:00 PM'}];
const MONTH_MAP = {"JAN":0,"FEB":1,"MAR":2,"APR":3,"MAY":4,"JUN":5,"JUL":6,"AUG":7,"SEP":8,"OCT":9,"NOV":10,"DEC":11};

// Robust date parser for the Table
function parseSheetDate(dStr) {
    if (!dStr) return null;
    const d = new Date(dStr);
    if (!isNaN(d.getTime())) { d.setHours(0,0,0,0); return d; }
    const parts = String(dStr).trim().toUpperCase().split(/\s+/);
    if (parts.length === 3) {
        const month = MONTH_MAP[parts[1]];
        if (month !== undefined) return new Date(parseInt(parts[2], 10), month, parseInt(parts[0], 10), 0,0,0);
    }
    return null;
}

function handleGoogleLogin(response) {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    currentUser = { name: payload.name || payload.email, email: payload.email, picture: payload.picture || null };
    showPortal();
}

function showPortal() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('portal-screen').style.display = 'block';
    document.getElementById('user-display-name').textContent = currentUser.name;
    if (currentUser.picture) {
        document.getElementById('user-initials').outerHTML = `<img src="${currentUser.picture}" class="user-avatar">`;
    } else {
        document.getElementById('user-initials').textContent = currentUser.name[0].toUpperCase();
    }
    fetchLive();
}

function signOut() { location.reload(); }

function getWeekDays(o) {
    const d = new Date();
    const day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1) + (o * 7);
    const mon = new Date(d.setDate(diff)); mon.setHours(0,0,0,0);
    const tue = new Date(mon); tue.setDate(mon.getDate() + 1);
    const thu = new Date(mon); thu.setDate(mon.getDate() + 3);
    return {tue, thu, mon};
}

function fmtDate(d) {
    return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
}

// FIX: Unique key based on actual Date string, not relative week
function skey(dateObj, index) {
    const dStr = dateObj.toISOString().split('T')[0];
    return `${dStr}_${index}`;
}

function isBookingOpen(slotDate, dk) {
    const today = new Date(); today.setHours(0,0,0,0);
    const deadline = new Date(slotDate);
    deadline.setDate(slotDate.getDate() - (dk === 'tue' ? 5 : 3));
    deadline.setHours(0,0,0,0);
    return today <= deadline;
}

async function fetchLive() {
    try {
        const res = await fetch(`${SCRIPT_URL}?action=fetch&t=${Date.now()}`);
        const d = await res.json();
        if (d.success) { bookings = d.bookings || {}; allRows = d.allRows || []; render(); }
    } catch (e) { console.error(e); render(); }
}

function render() {
    const {tue, thu, mon} = getWeekDays(weekOffset);
    const today = new Date(); today.setHours(0,0,0,0);
    document.getElementById('week-chip').textContent = 'WEEK OF ' + mon.toLocaleDateString('en-GB', {day:'numeric', month:'short'}).toUpperCase();
    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    [{l:'Tuesday', d:tue, dk:'tue'}, {l:'Thursday', d:thu, dk:'thu'}].forEach(day => {
        const isPast = day.d < today;
        const bookingOpen = isBookingOpen(day.d, day.dk);
        let slotsHtml = SLOTS.map((s, i) => {
            const k = skey(day.d, i);
            const b = bookings[k];
            if (b) {
                const isOwner = currentUser && b.bookedByEmail && b.bookedByEmail.toLowerCase() === currentUser.email.toLowerCase();
                const canCancel = !isPast && bookingOpen && isOwner;
                return `<div class="slot-row">
                    <span>${s.s} – ${s.e}</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div class="booked-by">by ${b.bookedByName || 'Unknown'}</div>
                        <div class="booked-badge">Booked</div>
                        ${canCancel ? `<button class="cancel-btn" onclick="handleCancel('${k}')">Cancel</button>` : (isOwner ? '' : '🔒')}
                    </div>
                </div>`;
            }
            if (isPast || !bookingOpen) {
                return `<div class="slot-row" style="opacity:0.6;"><span>${s.s} – ${s.e}</span><div class="closed-badge">${isPast?'Closed':'Deadline'}</div></div>`;
            }
            return `<div class="slot-row"><span>${s.s} – ${s.e}</span><button class="avail-btn" onclick="openModal('${day.dk}',${i},'${day.l}',new Date(${day.d.getTime()}))"><span class="avail-label">Available</span><span class="avail-plus">+</span></button></div>`;
        }).join('');
        grid.innerHTML += `<div class="day-card"><div class="day-header"><div>${day.l}<br><small style="color:#aaa;font-size:10px;">${fmtDate(day.d)}</small></div></div><div>${slotsHtml}</div></div>`;
    });
    renderTable();
}

function renderTable() {
    const wrap = document.getElementById('bookings-wrap');
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = allRows.map(b => ({ ...b, _sortDate: parseSheetDate(b.date) }))
                            .filter(b => b._sortDate && b._sortDate >= today)
                            .sort((a,b) => a._sortDate - b._sortDate);
    if (!upcoming.length) {
        wrap.innerHTML = `<div style="background:#fff;padding:20px;text-align:center;color:#aaa;font-size:12px;">No upcoming bookings found.</div>`;
        return;
    }
    wrap.innerHTML = `<table class="bookings-table"><thead><tr><th>Date</th><th>Slot</th><th>Client</th><th>Project</th><th>Name</th><th>Booked By</th><th>Checklist</th></tr></thead>
        <tbody>${upcoming.map(b => `<tr><td>${b.date}</td><td>${b.time}</td><td>${b.client}</td><td>${b.project}</td><td>${b.name}</td><td><span class="audit-pill">${b.bookedByName || b.bookedByEmail}</span></td><td><a href="${b.checklist}" target="_blank" class="link-btn">View</a></td></tr>`).join('')}</tbody></table>`;
}

function openModal(dk, i, l, fullDate) {
    pendingKey = {dk, i, l, fullDate};
    document.getElementById('modal-sub').textContent = `${l} · ${SLOTS[i].s}`;
    document.getElementById('f-name').value = currentUser.name;
    document.getElementById('f-email').value = currentUser.email;
    ['project','client','remarks','checklist'].forEach(id => document.getElementById('f-'+id).value = '');
    document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

async function confirmBooking() {
    const data = {
        name: document.getElementById('f-name').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        project: document.getElementById('f-project').value.trim(),
        client: document.getElementById('f-client').value.trim(),
        checklist: document.getElementById('f-checklist').value.trim(),
        remarks: document.getElementById('f-remarks').value.trim(),
        bookedByName: currentUser.name,
        bookedByEmail: currentUser.email
    };
    if (!data.project || !data.client || !data.checklist) return alert("Please fill mandatory fields.");
    const payload = {
        action: 'book',
        slotKey: skey(pendingKey.fullDate, pendingKey.i),
        day: pendingKey.l,
        date: fmtDate(pendingKey.fullDate),
        time: `${SLOTS[pendingKey.i].s} - ${SLOTS[pendingKey.i].e}`,
        ...data
    };
    const res = await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(payload)});
    const result = await res.json();
    if (result.success) { fetchLive(); closeModal(); } else { alert(result.message || "Error"); }
}

async function handleCancel(k) {
    if (!confirm("Cancel this booking?")) return;
    const payload = { action: 'cancel', slotKey: k, cancelledByName: currentUser.name, cancelledByEmail: currentUser.email };
    const res = await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(payload)});
    if ((await res.json()).success) fetchLive();
}

function shiftWeek(d) { weekOffset += d; render(); }
</script>
</body>
</html>
