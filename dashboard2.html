<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapture | Client Transition Portal</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        .portal{background:#f2f1ef;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
        .topbar{background:#111;padding:0 28px;height:60px;display:flex;align-items:center;}
        .logo-img {height: 25px; width: auto; margin-right: 20px;}
        .topbar-brand{color:#fff;font-size:13px;font-weight:600;margin-right:20px;border-right:1px solid #333;padding-right:20px;}
        .topbar-sub{color:#777;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;}
        .main{padding:32px 28px 60px; max-width: 1200px; margin: 0 auto;}
        .page-header{margin-bottom:22px;border-bottom:1px solid #ccc;padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
        .page-title{font-size:26px;font-weight:300;color:#111;letter-spacing:-.5px;}
        .page-title em{color:#cc1f2d;font-style:normal;font-weight:500;}
        .recurrence{font-size:10px;letter-spacing:1.5px;color:#888;text-transform:uppercase;text-align:right;line-height:2;}
        .controls{display:flex;align-items:center;margin-bottom:20px;}
        .nav-btn{background:#fff;border:1px solid #ccc;padding:7px 14px;font-size:11px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
        .week-chip{background:#111;color:#fff;padding:7px 18px;font-size:11px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;}
        .days-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
        @media(max-width:768px){.days-grid{grid-template-columns:1fr;}}
        .day-card{background:#fff;border:1px solid #ddd;overflow:hidden;}
        .day-header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
        .slot-row{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid #f2f2f2;}
        .avail-btn{display:flex;align-items:center;border:1px solid #1e9e6e;background:#fff;cursor:pointer;border-radius:2px;}
        .avail-label{padding:6px 10px;font-size:10px;font-weight:600;color:#1e9e6e;text-transform:uppercase;}
        .avail-plus{padding:6px 9px;background:#1e9e6e;color:#fff;font-size:14px;}
        .booked-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#cc1f2d;color:#fff;text-transform:uppercase;}
        .closed-badge{padding:6px 12px;font-size:10px;font-weight:700;background:#eee;color:#999;text-transform:uppercase;}
        .cancel-btn{padding:6px 10px;font-size:10px;font-weight:600;background:#fff;color:#888;border:1px solid #ccc;cursor:pointer;text-transform:uppercase;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;}
        .modal-overlay.open{display:flex;}
        .modal{background:#fff;width:100%;max-width:420px;box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);}
        .modal-header{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;}
        .modal-body{padding:22px;}
        .field{margin-bottom:15px;}
        .field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;color:#888;margin-bottom:4px;}
        .field input{width:100%;border:1px solid #ddd;padding:9px 12px;font-size:13px;outline:none;}
        .modal-footer{padding:0 22px 22px;display:flex;gap:10px;}
        .confirm-btn{flex:1;padding:12px;background:#111;color:#fff;border:none;font-size:12px;font-weight:600;text-transform:uppercase;cursor:pointer;}
        .bookings-table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border:1px solid #ddd;}
        .bookings-table th{background:#111;color:#fff;padding:12px;text-align:left;text-transform:uppercase;font-size:9px;}
        .bookings-table td{padding:10px 12px;border-bottom:1px solid #f2f2f2;}
        .link-btn {color: #cc1f2d; text-decoration: none; font-weight: bold;}
    </style>
</head>
<body>

<div class="portal">
    <div class="topbar">
        <img src="https://testrigor.com/wp-content/uploads/2023/12/kapture-cx.svg" alt="Logo" class="logo-img">
        <span class="topbar-brand">Kapture CX</span>
        <span class="topbar-sub">Client Transition Portal</span>
    </div>
    <div class="main">
        <div class="page-header">
            <div class="page-title">Project <em>Handover</em> Schedule</div>
            <div class="recurrence"><strong>TUESDAYS & THURSDAYS</strong><br>1:00 PM – 2:00 PM</div>
        </div>
        <div class="controls">
            <button class="nav-btn" onclick="shiftWeek(-1)">← Prev</button>
            <div class="week-chip" id="week-chip">LOADING...</div>
            <button class="nav-btn" onclick="shiftWeek(1)">Next →</button>
        </div>
        <div class="days-grid" id="days-grid"></div>
        <div style="font-size:13px;font-weight:600;margin-bottom:10px;text-transform:uppercase;color:#444;">Upcoming Booking Details</div>
        <div id="bookings-wrap"></div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div style="font-size:15px;font-weight:500;">Book Handover Slot</div>
                <div id="modal-sub" style="font-size:10px;color:#aaa;text-transform:uppercase;"></div>
            </div>
            <button style="background:none;border:none;color:#fff;cursor:pointer;" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="field"><label>Name of Person</label><input type="text" id="f-name"></div>
            <div class="field"><label>Email Address</label><input type="email" id="f-email"></div>
            <div class="field"><label>Project Name</label><input type="text" id="f-project"></div>
            <div class="field"><label>Client Name</label><input type="text" id="f-client"></div>
            <div class="field"><label>Handover Checklist (Link)</label><input type="text" id="f-checklist" placeholder="Paste link here..."></div>
            <div class="field"><label>Remarks</label><input type="text" id="f-remarks"></div>
        </div>
        <div class="modal-footer">
            <button class="confirm-btn" onclick="confirmBooking()">Confirm Booking →</button>
        </div>
    </div>
</div>

<script>
// REPLACE WITH YOUR URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcM8VXSILNLlMm-uPkhMZ2GwpBf2CopLFdfjR-5eMcnITdXCId1maWJdV1rPgF9Goc/exec";

const SLOTS = [{s:'1:00 PM', e:'1:30 PM'}, {s:'1:30 PM', e:'2:00 PM'}];
let weekOffset = 0, bookings = {}, allRows = [], pendingKey = null;

// Month name → index map for robust date parsing
const MONTH_MAP = {
    "JAN":0,"FEB":1,"MAR":2,"APR":3,"MAY":4,"JUN":5,
    "JUL":6,"AUG":7,"SEP":8,"OCT":9,"NOV":10,"DEC":11
};

/**
 * Parse a date string like "17 MAR 2026" into a Date object (midnight local time).
 * Returns null if the string is unparseable.
 */
function parseSheetDate(dStr) {
    if (!dStr) return null;
    const parts = String(dStr).trim().toUpperCase().split(/\s+/);
    if (parts.length !== 3) return null;
    const day   = parseInt(parts[0], 10);
    const month = MONTH_MAP[parts[1]];
    const year  = parseInt(parts[2], 10);
    if (isNaN(day) || month === undefined || isNaN(year)) return null;
    const d = new Date(year, month, day);
    d.setHours(0, 0, 0, 0);
    return d;
}

function getWeekDays(o) {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const diff = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1) + (o * 7);
    const mon = new Date(now.setDate(diff));
    const tue = new Date(mon); tue.setDate(mon.getDate() + 1);
    const thu = new Date(mon); thu.setDate(mon.getDate() + 3);
    return {tue, thu, mon};
}

function fmtDate(d) {
    return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
}

function skey(dk, i) { return `w${weekOffset}_${dk}_${i}`; }

/**
 * Returns true if the slot is still open for booking.
 * Tuesday  → deadline is previous Thursday (end of day)
 * Thursday → deadline is Monday of the same week (end of day)
 * Both use "working days" logic: 2 clear working days before the slot.
 */
function isBookingOpen(slotDate, dk) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let deadline;

    if (dk === 'tue') {
        // Deadline = Thursday of the PREVIOUS week
        // slotDate is Tuesday; go back 5 days to get previous Thursday
        deadline = new Date(slotDate);
        deadline.setDate(slotDate.getDate() - 5);
    } else {
        // dk === 'thu': Deadline = Monday of the SAME week
        // slotDate is Thursday; go back 3 days to get Monday
        deadline = new Date(slotDate);
        deadline.setDate(slotDate.getDate() - 3);
    }
    deadline.setHours(0, 0, 0, 0);
    // Booking is open if today is on or before the deadline
    return today <= deadline;
}

async function fetchLive() {
    try {
        const r = await fetch(`${SCRIPT_URL}?action=fetch&t=${Date.now()}`);
        const d = await r.json();
        if (d.success) {
            bookings = d.bookings || {};
            allRows  = d.allRows  || [];  // ← full flat list from the sheet
            render();
        }
    } catch (e) {
        console.error(e);
        render();
    }
}

function render() {
    const {tue, thu, mon} = getWeekDays(weekOffset);
    const today = new Date(); today.setHours(0, 0, 0, 0);

    document.getElementById('week-chip').textContent =
        'WEEK OF ' + mon.toLocaleDateString('en-GB', {day:'numeric', month:'short'}).toUpperCase();

    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    [{l:'Tuesday', d:tue, dk:'tue'}, {l:'Thursday', d:thu, dk:'thu'}].forEach(day => {
        const isPast      = day.d < today;
        const bookingOpen = isBookingOpen(day.d, day.dk); // false = deadline passed

        let slotsHtml = SLOTS.map((s, i) => {
            const k = skey(day.dk, i);
            const b = bookings[k];

            if (b) {
                // Cancel only allowed if slot is in the future AND booking deadline hasn't passed
                const canCancel = !isPast && bookingOpen;
                const cancelBtn = canCancel
                    ? `<button class="cancel-btn" onclick="handleCancel('${day.dk}',${i})">Cancel</button>`
                    : '';
                return `<div class="slot-row">
                    <span>${s.s} – ${s.e}</span>
                    <div style="display:flex;gap:8px;">
                        <div class="booked-badge">Booked</div>${cancelBtn}
                    </div>
                </div>`;
            }
            // Slot is in the past OR booking deadline has passed → show Closed
            if (isPast || !bookingOpen) {
                const label = isPast ? 'Closed' : 'Deadline Passed';
                return `<div class="slot-row" style="opacity:0.6;">
                    <span>${s.s} – ${s.e}</span>
                    <div class="closed-badge">${label}</div>
                </div>`;
            }
            return `<div class="slot-row">
                <span>${s.s} – ${s.e}</span>
                <button class="avail-btn" onclick="openModal('${day.dk}',${i},'${day.l}')">
                    <span class="avail-label">Available</span><span class="avail-plus">+</span>
                </button>
            </div>`;
        }).join('');

        grid.innerHTML += `<div class="day-card">
            <div class="day-header">
                <div>${day.l}<br>
                <small style="color:#aaa;font-size:10px;">${fmtDate(day.d)}</small></div>
            </div>
            <div>${slotsHtml}</div>
        </div>`;
    });

    renderTable();
}

/**
 * Renders the Upcoming Booking Details table.
 * Uses the full `allRows` array from the sheet — NOT the week-scoped `bookings` object.
 * Filters to rows whose date >= today, sorted ascending.
 */
function renderTable() {
    const wrap  = document.getElementById('bookings-wrap');
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const upcoming = allRows
        .map(b => ({ ...b, _sortDate: parseSheetDate(b.date) }))
        .filter(b => b._sortDate && b._sortDate >= today)
        .sort((a, b) => a._sortDate - b._sortDate);

    if (!upcoming.length) {
        wrap.innerHTML = `<div style="background:#fff;padding:20px;text-align:center;color:#aaa;font-size:12px;">
            No upcoming bookings found.
        </div>`;
        return;
    }

    wrap.innerHTML = `
        <table class="bookings-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Slot</th>
                    <th>Client</th>
                    <th>Project</th>
                    <th>Name</th>
                    <th>Checklist</th>
                </tr>
            </thead>
            <tbody>
                ${upcoming.map(b => `
                    <tr>
                        <td>${b.date}</td>
                        <td>${b.time}</td>
                        <td>${b.client  || '-'}</td>
                        <td>${b.project || '-'}</td>
                        <td>${b.name}</td>
                        <td>${b.checklist
                            ? `<a href="${b.checklist}" target="_blank" class="link-btn">View Link</a>`
                            : '-'}</td>
                    </tr>`).join('')}
            </tbody>
        </table>`;
}

function openModal(dk, i, l) {
    pendingKey = {dk, i, l};
    document.getElementById('modal-sub').textContent = `${l} · ${SLOTS[i].s}`;
    ['name','email','project','client','remarks','checklist'].forEach(id =>
        document.getElementById('f-' + id).value = '');
    document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}

async function confirmBooking() {
    const data = {
        name     : document.getElementById('f-name').value,
        email    : document.getElementById('f-email').value,
        project  : document.getElementById('f-project').value,
        client   : document.getElementById('f-client').value,
        remarks  : document.getElementById('f-remarks').value,
        checklist: document.getElementById('f-checklist').value
    };
    if (!data.name || !data.email) return alert("Please fill Name and Email.");

    const {tue, thu} = getWeekDays(weekOffset);
    const payload = {
        action   : 'book',
        slotKey  : skey(pendingKey.dk, pendingKey.i),
        day      : pendingKey.l,
        date     : fmtDate(pendingKey.dk === 'tue' ? tue : thu),
        time     : `${SLOTS[pendingKey.i].s} - ${SLOTS[pendingKey.i].e}`,
        ...data
    };

    const res    = await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify(payload)});
    const result = await res.json();
    if (result.success) {
        fetchLive();
        closeModal();
    }
}

async function handleCancel(dk, i) {
    const k = skey(dk, i);
    if (!confirm("Cancel this booking?")) return;
    const res    = await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify({action:'cancel', slotKey:k})});
    const result = await res.json();
    if (result.success) { fetchLive(); }
}

function shiftWeek(d) { weekOffset += d; render(); }

fetchLive();
</script>
</body>
</html>
